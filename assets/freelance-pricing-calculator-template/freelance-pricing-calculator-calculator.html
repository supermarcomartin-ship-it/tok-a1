<!doctype html><meta charset="utf-8"><title>Freelance pricing calculator calculator</title><style>body{font:16px system-ui;margin:2rem;max-width:34rem}label{display:block;margin:.6rem 0}input{width:100%;padding:.4rem}#out{font-size:1.6rem;margin-top:1rem;font-weight:600}</style><h1>Freelance pricing calculator calculator</h1><label>Units<input id="units" type="number" step="any" value="10"></label>
<label>Price per unit<input id="unit_price" type="number" step="any" value="25"></label>
<label>Rate (%)<input id="rate" type="number" step="any" value="10"></label><div id="out">-</div><script>function run(){const units = Number(document.getElementById("units").value) || 0; const unit_price = Number(document.getElementById("unit_price").value) || 0; const rate = Number(document.getElementById("rate").value) || 0; const result = units * unit_price * (rate / 100);document.getElementById("out").textContent = (isFinite(result)?result.toFixed(2):"-") + " USD";}document.querySelectorAll('input').forEach(i=>i.addEventListener('input',run));run();</script>
