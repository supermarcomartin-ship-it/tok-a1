<!doctype html><meta charset="utf-8"><title>VAT calculator</title><style>body{font:16px system-ui;margin:2rem;max-width:34rem}label{display:block;margin:.6rem 0}input{width:100%;padding:.4rem}#out{font-size:1.6rem;margin-top:1rem;font-weight:600}</style><h1>VAT calculator</h1><label>Net amount<input id="net" type="number" step="any" value="100"></label>
<label>VAT rate (%)<input id="rate" type="number" step="any" value="20"></label><div id="out">-</div><script>function run(){const net = Number(document.getElementById("net").value) || 0; const rate = Number(document.getElementById("rate").value) || 0; const result = net * (1 + rate / 100);document.getElementById("out").textContent = (isFinite(result)?result.toFixed(2):"-") + " gross";}document.querySelectorAll('input').forEach(i=>i.addEventListener('input',run));run();</script>
